<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --green: #1bc47d;
    --green-soft: rgba(27, 196, 125, .14);
    --accent: #4261EE;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font: 12px/1.45 Inter, system-ui, sans-serif;
    color: var(--figma-color-text); background: var(--figma-color-bg);
    -webkit-font-smoothing: antialiased;
  }
  body.loading { visibility: hidden; } /* avoids a language flash before saved prefs arrive */

  header { flex: none; padding: 16px 16px 12px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .right { flex: none; display: flex; align-items: center; gap: 6px; }
  .eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 2px;
  }
  .eyebrow small { font-size: 10px; letter-spacing: 0; text-transform: none; opacity: .7; font-weight: 500; }
  h1 { margin: 0; font-size: 15px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }

  .icon-btn {
    flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 7px; cursor: pointer; background: transparent;
    color: var(--figma-color-text-secondary); transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--figma-color-bg-hover); color: var(--figma-color-text); }
  .icon-btn svg { width: 16px; height: 16px; }

  .status {
    display: flex; align-items: center; gap: 5px; height: 24px;
    padding: 0 10px 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--figma-color-bg-secondary); color: var(--figma-color-text-secondary);
    transition: background .25s, color .25s;
  }
  .status svg { width: 14px; height: 14px; display: none; }
  body.all-done .status { background: var(--green); color: #fff; box-shadow: 0 2px 10px rgba(27,196,125,.4); }
  body.all-done .status svg { display: block; animation: pop .35s ease-out; }
  body.empty .status { display: none; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

  .target {
    display: flex; align-items: center; gap: 10px; margin-top: 14px;
    padding: 9px 11px; border-radius: 10px;
    background: var(--figma-color-bg-secondary);
    border: 1px solid var(--figma-color-border);
  }
  .target .ico {
    flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: rgba(66, 97, 238, .14); color: var(--accent);
  }
  .target .ico svg { width: 16px; height: 16px; }
  .target .meta { min-width: 0; }
  .target .name { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .target .sub { color: var(--figma-color-text-secondary); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.empty .target { display: none; }

  .bar { height: 6px; margin-top: 12px; border-radius: 999px; background: var(--figma-color-bg-secondary); overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0; border-radius: inherit;
    background: var(--accent);
    transition: width .3s ease;
  }
  body.empty .bar { display: none; }

  ul { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 4px 12px 12px; }
  body.empty ul { display: none; }
  li { margin-bottom: 6px; }
  label {
    display: flex; align-items: flex-start; gap: 10px; cursor: pointer;
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--figma-color-border);
    background: var(--figma-color-bg);
    transition: border-color .15s, background .15s, transform .1s;
  }
  label:hover { background: var(--figma-color-bg-hover); border-color: var(--figma-color-border-strong); }
  label:active { transform: scale(.995); }
  input { position: absolute; opacity: 0; pointer-events: none; }

  .box {
    flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 6px;
    border: 1.5px solid var(--figma-color-border-strong);
    display: grid; place-items: center; transition: all .15s;
  }
  .box svg { width: 12px; height: 12px; stroke: #fff; opacity: 0; transform: scale(.5); transition: all .15s; }
  .text { flex: 1; transition: color .15s; }

  li.done label { background: var(--green-soft); border-color: transparent; }
  li.done .box { background: var(--green); border-color: var(--green); }
  li.done .box svg { opacity: 1; transform: scale(1); }
  li.done .text { color: var(--figma-color-text-secondary); }
  input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }

  .placeholder {
    flex: 1; min-height: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 0 32px 32px; text-align: center;
  }
  body.empty .placeholder { display: flex; }
  .placeholder .big {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 6px;
    background: rgba(66, 97, 238, .12); color: var(--accent);
  }
  .placeholder .big svg { width: 24px; height: 24px; }
  .placeholder b { font-size: 13px; }
  .placeholder span { color: var(--figma-color-text-secondary); }

  footer {
    flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; border-top: 1px solid var(--figma-color-border);
  }
  .info { min-width: 0; color: var(--figma-color-text-secondary); font-size: 11px; }
  .info .count { font-variant-numeric: tabular-nums; color: var(--figma-color-text); font-weight: 500; }
  .info .upd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #reset {
    flex: none; font: inherit; font-weight: 500; cursor: pointer; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--figma-color-border); background: var(--figma-color-bg);
    color: var(--figma-color-text); transition: background .15s;
  }
  #reset:hover { background: var(--figma-color-bg-hover); }
  body.empty footer { display: none; }

  /* Settings screen */
  .settings {
    position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column;
    background: var(--figma-color-bg);
  }
  body.settings-open .settings { display: flex; }
  .s-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--figma-color-border); }
  .s-head h2 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
  .s-body { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  .field .lbl { font-size: 11px; font-weight: 600; color: var(--figma-color-text-secondary); margin-bottom: 8px; }
  .seg {
    display: flex; padding: 3px; gap: 3px; border-radius: 10px;
    background: var(--figma-color-bg-secondary); border: 1px solid var(--figma-color-border);
  }
  .seg button {
    flex: 1; font: inherit; font-weight: 500; padding: 7px 0; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--figma-color-text-secondary); transition: all .15s;
  }
  .seg button:hover { color: var(--figma-color-text); }
  .seg button.on { background: var(--accent); color: #fff; box-shadow: 0 1px 4px rgba(66, 97, 238,.4); }
  .s-ver { color: var(--figma-color-text-tertiary); font-size: 11px; }

  /* Blocking screen shown when the installed version is outdated */
  .update {
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 32px; text-align: center;
    background: var(--figma-color-bg);
  }
  body.outdated .update { display: flex; }
  .update .big {
    width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 8px;
    background: rgba(66, 97, 238, .14); color: var(--accent);
  }
  .update .big svg { width: 28px; height: 28px; }
  .update h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
  .update p { margin: 0; color: var(--figma-color-text-secondary); }
  .update .versions { font-variant-numeric: tabular-nums; font-size: 11px; margin-top: 2px; }
  .update a.btn {
    margin-top: 14px; padding: 9px 16px; border-radius: 9px; font-weight: 600; font-size: 12px;
    background: var(--accent); color: #fff; text-decoration: none;
  }
  .update a.btn:hover { filter: brightness(1.08); }
  .update .how { margin-top: 10px; font-size: 11px; max-width: 250px; }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { flex: none; width: 34px; height: 34px; border-radius: 4px; }

  /* Small language switch pinned to the bottom of the update / version-check screens */
  .lang-mini {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 11; display: none;
    padding: 2px; gap: 2px; border-radius: 8px;
    background: var(--figma-color-bg-secondary); border: 1px solid var(--figma-color-border);
  }
  body.checking .lang-mini, body.check-failed .lang-mini, body.outdated .lang-mini { display: flex; }
  .lang-mini button {
    font: inherit; font-size: 10px; font-weight: 600; line-height: 1; padding: 4px 9px; border: 0; border-radius: 6px;
    cursor: pointer; background: transparent; color: var(--figma-color-text-secondary); transition: all .15s;
  }
  .lang-mini button:hover { color: var(--figma-color-text); }
  .lang-mini button.on { background: var(--accent); color: #fff; }

  /* Gate shown while the version check runs, and when it can't complete */
  .gate {
    position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 32px; text-align: center;
    background: var(--figma-color-bg);
  }
  body.checking .gate, body.check-failed .gate { display: flex; }
  .gate h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
  .gate p { margin: 0; color: var(--figma-color-text-secondary); max-width: 250px; }
  .gate .spinner {
    width: 26px; height: 26px; border-radius: 50%; margin-bottom: 8px;
    border: 3px solid var(--figma-color-bg-secondary); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gate .big {
    display: none; width: 56px; height: 56px; border-radius: 16px; place-items: center; margin-bottom: 8px;
    background: rgba(66, 97, 238, .14); color: var(--accent);
  }
  .gate .big svg { width: 28px; height: 28px; }
  .gate .retry {
    display: none; margin-top: 14px; padding: 9px 16px; border: 0; border-radius: 9px; cursor: pointer;
    font: inherit; font-weight: 600; background: var(--accent); color: #fff;
  }
  .gate .retry:hover { filter: brightness(1.08); }
  body.check-failed .gate .spinner { display: none; }
  body.check-failed .gate .big { display: grid; }
  body.check-failed .gate .retry { display: block; }
  body.checking .gate .failed-only, body.check-failed .gate .checking-only { display: none; }
</style>
</head>

<script>
const VERSION = '1.5.0';
const VERSION_URL = 'https://raw.githubusercontent.com/tolgakutukcu/pydedesign-figma-checklist/main/version.json';

// `id` is what gets stored in the file, so item text can be edited freely.
// `legacy` is the old text key used before ids existed, kept so existing checks still show up.
const ITEMS = [
  { id: 'component-structure', legacy: 'Component yapısı korundu',
    en: 'Component structure preserved', tr: 'Component yapısı korundu' },
  { id: 'styles-variables', legacy: 'Renk, text ve efektler style / variable ile kullanılmış',
    en: 'Colors, text and effects use styles / variables', tr: 'Renk, text ve efektler style / variable ile kullanılmış' },
  { id: 'clean-layers', legacy: 'Gereksiz ve gizli layer’lar kaldırıldı',
    en: 'Unnecessary and hidden layers removed', tr: 'Gereksiz ve gizli layer’lar kaldırıldı' },
  { id: 'ads', legacy: 'Reklamlı ekranlarda reklam gösterimi eklendi',
    en: 'Ad placements added on screens with ads', tr: 'Reklamlı ekranlarda reklam gösterimi eklendi' },
  { id: 'no-extra-page', legacy: 'Feature güncellemesi ise ekstra sayfa eklenmedi',
    en: 'No extra page added for feature updates', tr: 'Feature güncellemesi ise ekstra sayfa eklenmedi' },
  { id: 'drafts', legacy: 'Draft’lar temizlendi',
    en: 'Drafts cleaned up', tr: 'Draft’lar temizlendi' },
  { id: 'notes', legacy: 'Gerekli notlar eklendi',
    en: 'Necessary notes added', tr: 'Gerekli notlar eklendi' },
  { id: 'auto-layout', legacy: 'Auto layout / responsive design kontrol edildi',
    en: 'Auto layout / responsive design checked', tr: 'Auto layout / responsive design kontrol edildi' },
  { id: 'small-screen', legacy: 'Küçük ekran kontrolü yapıldı',
    en: 'Small screen check done', tr: 'Küçük ekran kontrolü yapıldı' },
  { id: 'naming', legacy: 'Root frame / section isimlendirmesi yapılmış',
    en: 'Root frame / section naming done', tr: 'Root frame / section isimlendirmesi yapılmış' },
  { id: 'long-text', legacy: 'Yabancı diller için uzun metin testi yapıldı',
    en: 'Long text tested for other languages', tr: 'Yabancı diller için uzun metin testi yapıldı' },
  { id: 'states', legacy: 'Empty, loading ve hata state’leri eklendi',
    en: 'Empty, loading and error states added', tr: 'Empty, loading ve hata state’leri eklendi' },
  { id: 'dark-mode', legacy: 'Dark mode / tema kontrolü yapıldı',
    en: 'Dark mode / theme check done', tr: 'Dark mode / tema kontrolü yapıldı' }
];

const STRINGS = {
  en: {
    reset: 'Reset', completed: 'Completed', settings: 'Settings', back: 'Back', language: 'Language', version: 'Version',
    emptyTitle: 'Select a frame or section',
    emptyText: 'The checklist works on sections, root frames, and frames placed directly inside a section. Nested frames and layers are not supported — select the frame or section itself.',
    multiTitle: 'Select a single frame or section',
    multiText: (n) => n + ' different frames / sections are selected. The checklist shows one at a time.',
    inSection: (s) => 'in section “' + s + '”',
    items: (n, total) => n + ' / ' + total + ' items',
    lastUpdated: 'Last updated: ', nothingChecked: 'Nothing checked yet',
    justNow: 'just now', minAgo: ' min ago', hAgo: ' h ago', dateLocale: 'en-US',
    updTitle: 'Update required',
    updText: 'A newer version of this plugin is available. Please download it to keep using the checklist.',
    updDownload: 'Download from GitHub',
    updHow: 'Then in Figma: Plugins → Development → Import plugin from manifest… and pick the new manifest.json.',
    installed: 'Installed', latest: 'Latest',
    chkTitle: 'Checking for updates…', chkText: 'Making sure you are on the latest version.',
    failTitle: 'Can’t verify version',
    failText: 'The plugin needs an internet connection to check for updates before it can be used. Check your connection and try again.',
    retry: 'Try again'
  },
  tr: {
    reset: 'Sıfırla', completed: 'Tamamlandı', settings: 'Ayarlar', back: 'Geri', language: 'Dil', version: 'Sürüm',
    emptyTitle: 'Bir frame veya section seç',
    emptyText: 'Checklist; section, root frame ve doğrudan bir section içindeki frame’lerde çalışır. İç içe frame’ler ve layer’lar desteklenmez — frame veya section’ın kendisini seç.',
    multiTitle: 'Tek bir frame veya section seç',
    multiText: (n) => n + ' farklı frame / section seçili. Checklist aynı anda sadece birini gösterir.',
    inSection: (s) => '“' + s + '” section’ında',
    items: (n, total) => n + ' / ' + total + ' madde',
    lastUpdated: 'Son güncelleme: ', nothingChecked: 'Henüz işaretlenmedi',
    justNow: 'az önce', minAgo: ' dk önce', hAgo: ' sa önce', dateLocale: 'tr-TR',
    updTitle: 'Güncelleme gerekli',
    updText: 'Bu plugin’in daha yeni bir sürümü var. Checklist’i kullanmaya devam etmek için lütfen indir.',

    updHow: 'Sonra Figma’da: Plugins → Development → Import plugin from manifest… yolunu izleyip yeni manifest.json’ı seç.',
    installed: 'Yüklü', latest: 'Son',
    chkTitle: 'Güncelleme kontrol ediliyor…', chkText: 'En son sürümde olduğundan emin olunuyor.',
    failTitle: 'Sürüm doğrulanamadı',
    failText: 'Plugin’in kullanılabilmesi için güncelleme kontrolü gerekiyor ve bunun için internet bağlantısı lazım. Bağlantını kontrol edip tekrar dene.',
    retry: 'Tekrar dene'
  }
};

const ICONS = {
  Frame: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5.5 2v12M10.5 2v12M2 5.5h12M2 10.5h12"/></svg>',
  Section: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2 5.5V4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1v1.5M2 5.5h12V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5.5z"/></svg>',
  Pointer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6L5 3z"/></svg>'
};
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';

const $ = (id) => document.getElementById(id);
let lang = 'en';
let targetId = null;
let lastState = { status: 'none' };
let latestVersion = null;
let remoteVersion = null; // last version number read from GitHub (shown in Settings for troubleshooting)
const t = () => STRINGS[lang];

function send(m) { parent.postMessage({ pluginMessage: m }, '*'); }

function build() {
  ITEMS.forEach((item) => {
    const li = document.createElement('li');
    li.innerHTML = '<label><input type="checkbox"><span class="box">' + CHECK + '</span><span class="text"></span></label>';
    li.querySelector('input').onchange = (e) => {
      const value = e.target.checked;
      li.classList.toggle('done', value); // instant feedback; real state arrives right after
      send({ type: 'toggle', id: targetId, item: item.id, legacy: item.legacy, value });
    };
    li._item = item;
    $('list').append(li);
  });
}

function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return t().justNow;
  if (s < 3600) return Math.floor(s / 60) + t().minAgo;
  if (s < 86400) return Math.floor(s / 3600) + t().hAgo;
  return new Date(ts).toLocaleDateString(t().dateLocale);
}

function showEmpty(title, text) {
  targetId = null;
  document.body.classList.add('empty');
  document.body.classList.remove('all-done');
  $('phIco').innerHTML = ICONS.Pointer;
  $('phTitle').textContent = title;
  $('phText').textContent = text;
}

function render(m) {
  lastState = m;
  if (m.status === 'none') return showEmpty(t().emptyTitle, t().emptyText);
  if (m.status === 'multiple') return showEmpty(t().multiTitle, t().multiText(m.count));

  document.body.classList.remove('empty');
  targetId = m.target.id;
  $('targetIco').innerHTML = ICONS[m.target.kind];
  $('targetName').textContent = m.target.name;
  $('targetSub').textContent = m.target.kind + ' · ' + (m.target.section ? t().inSection(m.target.section) : m.target.page);

  const done = new Set(m.done);
  let n = 0;
  document.querySelectorAll('li').forEach((li) => {
    const on = done.has(li._item.id) || done.has(li._item.legacy);
    li.classList.toggle('done', on);
    li.querySelector('input').checked = on;
    if (on) n++;
  });
  const total = ITEMS.length;
  $('bar').style.width = (n / total) * 100 + '%';
  $('count').textContent = t().items(n, total);
  $('upd').textContent = m.at ? t().lastUpdated + (m.by ? m.by + ' · ' : '') + ago(m.at) : t().nothingChecked;
  $('statusText').textContent = n === total ? t().completed : n + '/' + total;
  document.body.classList.toggle('all-done', n === total);
}

// Applies the current language to all static text, item labels and dynamic screens.
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t()[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t()[el.dataset.i18nTitle]; });
  document.querySelectorAll('li').forEach((li) => { li.querySelector('.text').textContent = li._item[lang]; });
  document.querySelectorAll('[data-lang]').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  $('sVer').textContent = t().version + ' ' + VERSION + (remoteVersion ? '  ·  GitHub: v' + remoteVersion : '');
  if (latestVersion) $('versions').textContent = t().installed + ': v' + VERSION + '  ·  ' + t().latest + ': v' + latestVersion;
  render(lastState);
}

// Returns true if version a is older than b (e.g. '1.0.0' < '1.1.0').
function isOlder(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x < y;
  }
  return false;
}

// The version check is mandatory: the plugin stays behind a gate until it succeeds.
// If the check can't complete (offline, GitHub unreachable, bad response) the gate stays up with a retry button.
// A silent re-check (periodic, while the plugin stays open) only blocks when it positively finds a newer
// version; a failed silent check is ignored so a brief network blip doesn't interrupt someone mid-work.
async function checkVersion(silent) {
  const cl = document.body.classList;
  if (!silent) {
    cl.remove('check-failed', 'outdated');
    cl.add('checking');
  }
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(VERSION_URL + '?t=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const latest = (await res.json()).version;
    if (typeof latest !== 'string' || !/^\d+\.\d+\.\d+$/.test(latest)) throw new Error('Bad version');
    remoteVersion = latest;
    console.log('[Pyde checklist] installed v' + VERSION + ', GitHub v' + latest);
    if (isOlder(VERSION, latest)) {
      latestVersion = latest;
      cl.add('outdated');
    }
    applyLang();
    cl.remove('checking');
  } catch (e) {
    if (!silent) {
      cl.remove('checking');
      cl.add('check-failed');
    }
  }
}
$('retry').onclick = () => checkVersion();
setInterval(() => checkVersion(true), 5 * 60 * 1000);

$('reset').onclick = () => { if (targetId) send({ type: 'reset', id: targetId }); };
$('openSettings').onclick = () => document.body.classList.add('settings-open');
$('closeSettings').onclick = () => document.body.classList.remove('settings-open');
document.querySelectorAll('[data-lang]').forEach((b) => {
  b.onclick = () => { lang = b.dataset.lang; send({ type: 'setLang', lang }); applyLang(); };
});

onmessage = (e) => {
  const m = e.data.pluginMessage;
  if (!m) return;
  if (m.type === 'prefs') {
    lang = m.lang === 'tr' ? 'tr' : 'en';
    applyLang();
    document.body.classList.remove('loading');
  } else if (m.type === 'state') {
    render(m);
  }
};
